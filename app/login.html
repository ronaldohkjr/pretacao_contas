<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestação de Contas — Entrar</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dfe3ea;--pri:#1f6f43;--pri2:#e7f3ec;--err:#b42318;--errbg:#fdecea}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
  main{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:26px 28px;width:min(380px,100%);box-shadow:0 6px 24px rgba(0,0,0,.06)}
  h1{font-size:20px;margin:0 0 4px;color:var(--pri)}
  p{margin:0 0 16px;color:var(--mut);font-size:14px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-bottom:12px}
  input{font:inherit;border:1px solid var(--bd);border-radius:6px;padding:9px 10px;color:var(--tx)}
  input:focus{outline:2px solid #9bd3b2;border-color:var(--pri)}
  button{width:100%;font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px;background:var(--pri);color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .erro{background:var(--errbg);color:var(--err);border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Prestação de Contas de Viagem</h1>
  <p id="sub">Entre com o seu usuário e senha.</p>
  <form id="f" autocomplete="on">
    <div id="erro" class="erro" hidden></div>
    <label id="lNome" hidden>Seu nome<input name="nome" autocomplete="name"></label>
    <label>Usuário<input name="login" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <label id="lConf" hidden>Repita a senha<input name="conf" type="password" autocomplete="new-password"></label>
    <button id="bt">Entrar</button>
  </form>
</main>
<script>
const f = document.getElementById("f"), erro = document.getElementById("erro");
let primeiro = false;
(async () => {  // sistema novo, sem nenhum usuário: cria o administrador
  try{ const r = await fetch("/api/primeiro_acesso", {method:"POST", headers:{"X-Gerador":"1"}, body:"{}"});
       primeiro = r.status !== 403; }catch(e){}
  if(primeiro){
    document.getElementById("sub").textContent = "Primeiro acesso: crie o usuário administrador (ele cadastra os técnicos).";
    document.getElementById("lNome").hidden = document.getElementById("lConf").hidden = false;
    f.senha.autocomplete = "new-password"; document.getElementById("bt").textContent = "Criar administrador e entrar";
  }
})();
f.onsubmit = async ev => {
  ev.preventDefault(); erro.hidden = true;
  if(primeiro && f.senha.value !== f.conf.value){ erro.textContent = "As senhas não são iguais."; erro.hidden = false; return; }
  const bt = document.getElementById("bt"); bt.disabled = true;
  try{
    const r = await fetch(primeiro ? "/api/primeiro_acesso" : "/api/login", {method:"POST", headers:{"X-Gerador":"1"},
      body: JSON.stringify({login: f.login.value, senha: f.senha.value, nome: f.nome.value})});
    const j = await r.json().catch(() => ({}));
    if(r.ok) location.href = "/";
    else{ erro.textContent = j.erro || "Não consegui entrar."; erro.hidden = false; }
  }catch(e){ erro.textContent = "Sem conexão com o servidor."; erro.hidden = false; }
  bt.disabled = false;
};
</script>
</body>
</html>
