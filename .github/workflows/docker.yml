# A cada atualização no GitHub: monta a imagem, testa e publica no GitHub Container Registry.
# Publica para Intel/AMD (amd64) e ARM (arm64, ex.: Oracle Cloud Ampere "Always Free").
name: Montar, testar e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Montar a imagem (amd64, para o teste)
        run: docker build -t gerador:teste .

      - name: Testar (servidor no ar, LibreOffice e OCR)
        run: |
          docker run -d --name gerador -p 8080:8080 gerador:teste
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/ping && break; sleep 2; done
          curl -sf http://localhost:8080/api/ping
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/ | grep -q 303
          docker exec gerador python -c "
          import sys, shutil; sys.path.insert(0, '/app/app')
          from pathlib import Path
          import servidor as s
          s.P.usar('ci'); x = Path('/tmp/t.xlsx'); shutil.copy('/app/modelo/DESPESAS_MODELO.xlsx', x)
          erro = s.planilha_em_pdf(x, Path('/tmp/t.pdf')); assert not erro, erro; print('planilha em PDF: OK')
          from rapidocr_onnxruntime import RapidOCR; RapidOCR(); print('OCR: OK')
          "
          docker logs gerador

      - name: Preparar a montagem para ARM
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Preparar o buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Publicar a imagem (ghcr.io, amd64 + arm64)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gerador-nf-online"
          VER="$(cat VERSAO.txt | tr -d '[:space:]')"
          docker buildx build --platform linux/amd64,linux/arm64 -t "$IMG:latest" -t "$IMG:$VER" --push .
